<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/stylesheet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script src="app.js?v=2" defer></script>
    <script src="javascript/script.js?v=2" defer></script>
    <title>FORGE PC Product</title>
</head>
<body>
    <!-- ======== HEADER WITH LOGO NAVIGATION AND ICONS ======== -->
    <header>
        <div class="containerHeader">
            <span class="titleHeader"><a href="index.html">FORGE PC</a></span>
                <!-- ======== MAIN NAVIGATION LINKS ======== -->
                <nav class="navBarHeader">
                    <ul class="navListHeader">
                        <li class="navListItemHeader"><a style="color: rgb(255, 157, 47); font-size: 1rem;" href="components.html">components</a></li>
                        <li class="navListItemHeader"><a href="contact.html">contact us</a></li>
                    </ul>
                </nav>
                <!-- ======== HEADER ICON LINKS ======== -->
                <div class="iconsHeader">
                    <a href="cart.html"><img 
                    src="photos/shopping-cart.png" alt="shopping cart" class="cartIcon"></a>
                    <a href="#"><img 
                    src="photos/user.png" 
                    alt="pictogram for a user profile" class="userIcon"></a>
                </div>
        </div>
    </header>
    <!-- ======== PRODUCT DETAIL PAGE WITH IMAGE AND PRODUCT INFORMATION ======== -->
    <section class="productPage">
        <!-- ======== PRODUCT IMAGE AREA ======== -->
        <div class="productContainerLeft">
            <div class="productContainerLeftImg">
                <img id="productImage" src="" alt="photo of the product">
            </div>    
            
            
        </div>
        <!-- ======== PRODUCT TEXT, PRICE, STOCK AND BUTTONS ======== -->
        <div class="productContainerRight">
            <p class="productBrandExtra" id="productBrandExtra"></p>
            <h1 id="productTitle"></h1>

            <p class="productDescription" id="productDescription"></p>
        
            <!-- ======== PRODUCT PRICE AND OLD PRICE ======== -->
            <div class="productDescriptionPriceContainer">
                <p class="productDescriptionPrice" id="productPrice"></p>
            </div>


            <button class="productAddToCartButton" id="productAddToCartButton"> 
                ADD TO CART
            </button>

            <button class="productFinanceButton">
                VIEW FINANCE OPTIONS
            </button>
        </div>  
    </section>
    <!-- ======== FOOTER WITH BRAND TEXT, LINKS AND POLICIES ======== -->
    <footer>
        <div class="gridContainerFooter">
            <!-- ======== FOOTER BRAND DESCRIPTION ======== -->
            <div class="titleFooter">
                <h2>Forge PC</h2>
                <p class="titleFooterExtraText">engineered for absolute <br> performance and <br> uncompromising performance</p>
            </div>
            <!-- ======== FOOTER QUICK LINKS ======== -->
            <div class="quickLinksFooter">
                 <p>Quick links</p>
                 <ul>
                    <li><a href="#">systems</a></li>
                    <li><a href="components.html">components</a></li>
                    <li><a href="#">configuration</a></li>
                    <li><a href="#">support</a></li>
                 </ul>
            </div>
            <!-- ======== FOOTER POLICY LINKS ======== -->
            <div class="policiesFooter">
                <p>policies</p>
                <ul>
                    <li><a href="#">Privacy Policy</a></li>
                    <li><a href="#">Terms of Service</a></li>
                    <li><a href="#">Shipping Info</a></li>
                    <li><a href="#">Warranty</a></li>
                </ul>
            </div>
            <!-- ======== FOOTER SOCIAL LINKS PLACEHOLDER ======== -->
            <div class="socials">
                <p>socials</p>
                <!-- ======== SOCIAL LINKS WILL BE ADDED HERE LATER ======== -->
            </div>
        </div>
    </footer>
</body>
</html>
