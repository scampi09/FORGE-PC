<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="javascript/crud.js" defer></script>
    <title>Producten CRUD</title>
</head>
<body>
    <h1>Producten CRUD</h1>

    <h2>Product toevoegen of aanpassen</h2>

    <form id="productForm">
        <label for="productID">productID:</label>
        <input type="number" id="productID" name="productID">
        <br><br>

        <label for="categorieID">categorieID:</label>
        <input type="number" id="categorieID" name="categorieID">
        <p>1 = gpu / 2 = cpu / 3 = ram / 4 = motherboards</p>
        <br><br>

        <label for="merk">merk:</label>
        <input type="text" id="merk" name="merk">
        <br><br>

        <label for="naam">naam:</label>
        <input type="text" id="naam" name="naam">
        <br><br>

        <label for="prijs">prijs:</label>
        <input type="number" id="prijs" name="prijs" step="0.01">
        <br><br>

        <label for="afbeelding">afbeelding:</label>
        <input type="text" id="afbeelding" name="afbeelding">
        <br><br>

        <label for="korteInfo">korteInfo:</label>
        <input type="text" id="korteInfo" name="korteInfo">
        <br><br>

        <label for="omschrijving">omschrijving:</label>
        <textarea id="omschrijving" name="omschrijving"></textarea>
        <br><br>

        <label for="tier">tier:</label>
        <input type="text" id="tier" name="tier">
        <br><br>

        <label for="voorraad">voorraad:</label>
        <input type="number" id="voorraad" name="voorraad">
        <br><br>

        <button type="button" id="btnToevoegen">Toevoegen</button>
        <button type="button" id="btnAanpassen">Aanpassen</button>
        <button type="button" id="btnVerwijderen">Verwijderen</button>
        <button type="reset" id="btnLeegmaken">Leegmaken</button>
    </form>

    <h2>Producten bekijken</h2>

    <table border="1" id="productenTabel">
        <thead>
            <tr>
                <th>productID</th>
                <th>categorieID</th>
                <th>merk</th>
                <th>naam</th>
                <th>prijs</th>
                <th>afbeelding</th>
                <th>korteInfo</th>
                <th>omschrijving</th>
                <th>tier</th>
                <th>voorraad</th>
            </tr>
        </thead>
        <tbody id="productenBody"></tbody>
    </table>
</body>
</html>
